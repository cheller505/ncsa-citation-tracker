[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ncsa-citation-tracker"
version = "1.0.0"
description = "Discover, evaluate, and curate NCSA Delta/DeltaAI supercomputer citations."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.0",
    "requests>=2.31",
    "urllib3>=2.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ddg = ["ddgs>=6.0"]

[project.scripts]
citation-tracker = "citation_tracker.cli:main"

[tool.setuptools]
packages = ["citation_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
