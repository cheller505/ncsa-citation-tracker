services:
  web:
    build: .
    image: ncsa-citation-tracker:latest
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      CITATION_DB_PATH: /data/citations.db
    volumes:
      - citation-data:/data
    restart: unless-stopped

  # Scheduled bulk discovery. Runs the default Delta/DeltaAI queries, then
  # sleeps a day. Disable by removing this service or scaling it to 0.
  ingest:
    image: ncsa-citation-tracker:latest
    env_file:
      - .env
    environment:
      CITATION_DB_PATH: /data/citations.db
    volumes:
      - citation-data:/data
    # Runs all DISCOVERY_QUERIES across OpenAlex + Crossref on a repeating
    # interval (INGEST_INTERVAL_HOURS), skipping already-tracked papers.
    command: ["python", "-m", "citation_tracker.cli", "serve-ingest"]
    restart: unless-stopped
    depends_on:
      - web

volumes:
  citation-data:
