# NCSA / University of Illinois Urbana-Champaign brand theme.
# Illini Blue #13294B, Illini Orange #FF5F05.
[theme]
primaryColor = "#FF5F05"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF1F6"
textColor = "#13294B"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
port = 8501
# Public, no-auth access: don't block external browsers on origin/XSRF checks.
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
