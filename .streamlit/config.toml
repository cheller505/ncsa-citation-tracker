# NCSA / University of Illinois Urbana-Champaign brand theme.
# Illini Blue #13294B, Illini Orange #FF5F05.
[theme]
primaryColor = "#FF5F05"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF1F6"
textColor = "#13294B"
font = "sans serif"

[server]
headless = true
# Bind to localhost only — the public entry point is the Caddy HTTPS proxy on
# :8443. Streamlit itself is not directly exposed.
address = "127.0.0.1"
port = 8601
# No-auth access behind the proxy: don't block on origin/XSRF checks.
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
